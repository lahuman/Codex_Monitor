site_name: Codex Monitor · Documentation
site_description: Codex Monitor desktop and Android guides and inherited codex-lb service reference
site_url: https://lahuman.github.io/Codex_Monitor/docs/
repo_url: https://github.com/lahuman/Codex_Monitor
repo_name: lahuman/Codex_Monitor
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

# Fail the --strict build on bad internal links / orphaned pages.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Codex Monitor:
      - Overview: monitor/index.md
      - Features and metrics: monitor/features.md
      - Work and release summary: monitor/releases.md
      - Development: monitor/development.md
      - Android: monitor/android.md
      - Windows: monitor/windows.md
      - Mac installation: monitor/macos-installation.md
      - Project website: monitor/website.md
      - Provenance and credits: monitor/provenance.md
      - GitHub publication: monitor/publishing.md
  - Getting Started: getting-started.md
  - Client Setup: client-setup.md
  - Live Voice: live-voice.md
  - Conversations: conversations.md
  - Usage Reporting: usage-reporting.md
  - Configuration: configuration.md
  - Anonymous Telemetry: telemetry.md
  - Authentication: authentication.md
  - Company Sign-In: sso.md
  - API Keys: api-keys.md
  - Routing: routing.md
  - Database: database.md
  - Deployment:
      - Docker: deployment/docker.md
      - Kubernetes: deployment/kubernetes.md
      - Remote Access: deployment/remote.md
  - Reference:
      - Settings: reference/settings.md
  - Traffic Parity: traffic-parity.md
  - Development:
      - Rust Migration Architecture: rust-architecture.md
  - Troubleshooting: troubleshooting.md
