name: Project website and docs

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "website/**"
      - "desktop/branding/icon.svg"
      - "desktop/scripts/project-links.mjs"
      - "desktop/src-tauri/tauri.conf.json"
      - "scripts/desktop/build-website.mjs"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "website/**"
      - "desktop/branding/icon.svg"
      - "desktop/scripts/project-links.mjs"
      - "desktop/src-tauri/tauri.conf.json"
      - "scripts/desktop/build-website.mjs"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# Deploys must not be cancelled mid-flight (GitHub Pages guidance);
# queued runs still coalesce per-ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build introduction and reference docs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.0'

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: "3.13"
          enable-cache: true
          prune-cache: true

      - name: Build docs
        run: |
          uv sync --only-group docs --frozen
          uv run --no-sync mkdocs build --strict --site-dir site/docs
          node scripts/desktop/build-website.mjs

      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Require GitHub Actions Pages source
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const { data: pages } = await github.rest.repos.getPages(context.repo);
            if (pages.build_type !== 'workflow') {
              core.setFailed('Settings → Pages → Build and deployment → Source를 GitHub Actions로 변경하세요. Branch 기반 Pages가 소개 페이지를 덮어쓸 수 있습니다.');
            }

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
