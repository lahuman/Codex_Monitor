name: Desktop release

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'frontend/**'
      - 'crates/codex-lb-server/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/desktop-windows.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'frontend/**'
      - 'crates/codex-lb-server/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/desktop-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Test and package Windows x64
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.0'
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Install pinned Rust toolchain
        run: |
          rustup show active-toolchain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup target add x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install NASM for aws-lc
        run: |
          choco install nasm --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:ProgramFiles\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install locked dependencies
        run: |
          bun install --cwd frontend --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build dashboard and verify packaging contracts
        run: |
          npm --prefix desktop run build:dashboard
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix desktop run test:packaging
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native persistence and desktop tests
        run: |
          cargo test --locked -p codex-lb-server --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p codex-lb-desktop --bin codex-lb-desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Release publication contracts
        run: node --test desktop/scripts/publish-desktop-release.test.mjs
      - name: Frontend tests
        run: |
          bun run --cwd frontend test src/desktop/App.test.tsx src/desktop/insights.test.tsx src/desktop/reset-credits.test.tsx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package NSIS installer
        run: npm --prefix desktop run package:windows
      - name: Resolve packaged artifact directory
        id: packaged
        run: |
          $version = (Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          "directory=desktop/releases/$version/windows-x64" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Upload versioned installer and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Codex-Monitor-windows-x64
          path: ${{ steps.packaged.outputs.directory }}
          if-no-files-found: error
          retention-days: 30

  package_macos:
    name: Test and package macOS Apple Silicon
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require native Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.0'
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install locked dependencies
        run: |
          bun install --cwd frontend --frozen-lockfile
          npm ci --prefix desktop
      - name: Build dashboard and test native monitoring
        run: |
          npm --prefix desktop run build:dashboard
          cargo test --locked -p codex-lb-server --lib
          cargo test --locked -p codex-lb-desktop --bin codex-lb-desktop
          node --test desktop/scripts/publish-desktop-release.test.mjs
          bun run --cwd frontend test src/desktop
      - name: Package and verify macOS distribution
        run: |
          npm --prefix desktop run package:macos
          npm --prefix desktop run test:macos-packaging
      - name: Resolve packaged artifact directory
        id: packaged
        run: |
          node --input-type=module - <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const config = JSON.parse(readFileSync('desktop/src-tauri/tauri.conf.json', 'utf8'));
          appendFileSync(process.env.GITHUB_OUTPUT, `directory=desktop/releases/${config.version}/macos-arm64\n`);
          JS
      - name: Upload macOS archives and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Codex-Monitor-macos-arm64
          path: ${{ steps.packaged.outputs.directory }}
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish macOS and Windows prerelease
    needs: [package, package_macos]
    if: github.repository == 'lahuman/Codex_Monitor' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Download this run's Windows artifacts
        uses: actions/download-artifact@fc02353415da80201a0da48ab47022efd7725d11
        with:
          name: Codex-Monitor-windows-x64
          path: ${{ runner.temp }}/codex-monitor-release/windows-x64
      - name: Download this run's macOS artifacts
        uses: actions/download-artifact@fc02353415da80201a0da48ab47022efd7725d11
        with:
          name: Codex-Monitor-macos-arm64
          path: ${{ runner.temp }}/codex-monitor-release/macos-arm64
      - name: Publish both verified platforms
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          WINDOWS_ARTIFACT_DIRECTORY: ${{ runner.temp }}/codex-monitor-release/windows-x64
          MACOS_ARTIFACT_DIRECTORY: ${{ runner.temp }}/codex-monitor-release/macos-arm64
        with:
          script: |
            const { pathToFileURL } = await import('node:url');
            const moduleURL = pathToFileURL(`${process.env.GITHUB_WORKSPACE}/desktop/scripts/publish-desktop-release.mjs`);
            const { publishDesktopRelease } = await import(moduleURL.href);
            await publishDesktopRelease({ github, context, core, windowsDirectory: process.env.WINDOWS_ARTIFACT_DIRECTORY, macosDirectory: process.env.MACOS_ARTIFACT_DIRECTORY });
