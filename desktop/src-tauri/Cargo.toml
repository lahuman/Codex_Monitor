[package]
name = "codex-lb-desktop"
version = "0.1.11"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
codex-lb-server = { path = "../../crates/codex-lb-server" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "~2.12.4", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tokio.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
unicode-segmentation = "1.13.3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSAttributedString", "NSString", "NSGeometry"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSImage", "NSFont", "NSFontDescriptor", "NSTextFieldCell", "NSActionCell", "NSColor", "NSAppearance", "block2", "NSCell", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSAttributedString", "NSStringDrawing", "objc2-core-foundation"] }
